<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fbe6ef" />
  <title>하치와레 🐱 놀이터</title>
  <meta name="description" content="하치와레를 쓰다듬고 볼을 콕콕! 미니게임도 즐기는 귀여운 놀이터" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M16 42 11 7 37 25Q50 21 63 25L89 7 84 42Q95 57 83 77Q72 93 50 93Q28 93 17 77Q5 57 16 42Z' fill='%23fff' stroke='%23476176' stroke-width='3'/%3E%3Cpath d='M14 39 11 7 37 25Q50 21 63 25L89 7 86 39Q73 47 64 42Q57 38 50 51Q43 38 36 42Q27 47 14 39Z' fill='%2378b8d9'/%3E%3Ccircle cx='37' cy='59' r='3'/%3E%3Ccircle cx='63' cy='59' r='3'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="sky">
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cloud c3"></span>
  </div>

  <header class="app-header">
    <h1 class="logo">🐱 하치와레 놀이터</h1>
    <button id="soundToggle" class="sound-btn" aria-label="소리 켜기/끄기" title="소리 켜기/끄기">🔔</button>
  </header>

  <main class="app-main">
    <!-- ========== 놀아주기 (마스코트) ========== -->
    <section id="view-play" class="view is-active" aria-label="하치와레 놀이터">
      <div class="mascot-stage">
        <div class="mood-bar" aria-hidden="true">
          <div class="mood-bar__fill" id="moodFill"></div>
        </div>
        <p class="mood-label"><span id="moodEmoji">😊</span> <span id="moodText">기분 좋아!</span></p>

        <div class="mascot-wrap" id="mascotWrap">
          <!-- 하치와레 SVG: 눈 깜빡임과 입 모양은 JS로 제어 -->
          <svg id="mascot" class="mascot" viewBox="0 0 200 220" role="img" aria-label="치이카와의 하치와레">
            <ellipse class="shadow" cx="100" cy="205" rx="52" ry="10" />
            <ellipse class="arm arm-l" cx="47" cy="151" rx="17" ry="23" transform="rotate(24 47 151)" />
            <ellipse class="arm arm-r" cx="153" cy="151" rx="17" ry="23" transform="rotate(-24 153 151)" />
            <ellipse class="body" cx="100" cy="164" rx="48" ry="40" />
            <ellipse class="foot" cx="76" cy="197" rx="19" ry="9" />
            <ellipse class="foot" cx="124" cy="197" rx="19" ry="9" />
            <path class="head" d="M35 80 Q30 58 30 17 Q31 10 38 15 L67 42 Q100 29 133 42 L162 15 Q169 10 170 17 Q170 58 165 80 Q180 101 170 133 Q158 166 100 168 Q42 166 30 133 Q20 101 35 80 Z" />
            <path class="blue-patch" d="M35 80 Q30 58 30 17 Q31 10 38 15 L67 42 Q100 29 133 42 L162 15 Q169 10 170 17 Q170 58 165 80 Q149 84 136 75 Q126 68 117 70 Q105 71 100 88 Q95 71 83 70 Q74 68 64 75 Q51 84 35 80 Z" />
            <path class="ear-detail" d="M37 24 62 49 Q48 47 39 58Z M163 24 138 49 Q152 47 161 58Z" />
            <ellipse class="cheek" cx="52" cy="119" rx="11" ry="7" />
            <ellipse class="cheek" cx="148" cy="119" rx="11" ry="7" />
            <g id="eyes">
              <ellipse class="eye" cx="74" cy="105" rx="5" ry="7" />
              <ellipse class="eye" cx="126" cy="105" rx="5" ry="7" />
            </g>
            <g id="eyesClosed" style="display:none">
              <path class="eye-line" d="M66 105 Q74 112 82 105" />
              <path class="eye-line" d="M118 105 Q126 112 134 105" />
            </g>
            <path class="nose" d="M96 119 Q100 116 104 119 Q100 123 96 119Z" />
            <path id="mouth" class="mouth" d="M92 125 Q100 133 108 125" />
          </svg>

          <div class="tap-hint" id="tapHint">콕! 눌러보세요 👆</div>
        </div>

        <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

        <div class="play-actions">
          <button class="pill-btn" id="btnPet">🫳 쓰다듬기</button>
          <button class="pill-btn" id="btnFeed">🍡 간식주기</button>
          <button class="pill-btn" id="btnSpin">🎁 랜덤뽑기</button>
        </div>
        <p class="stat-line">함께한 콕콕 <b id="totalPokes">0</b>번 · 오늘도 하치와레와 함께 💙</p>
      </div>
    </section>

    <!-- ========== 잡기 게임 ========== -->
    <section id="view-catch" class="view" aria-label="하치와레 잡기 게임">
      <div class="game-head">
        <h2>🕳️ 하치와레 잡기</h2>
        <p class="game-desc">튀어나오는 하치와레를 콕! 폭탄🧨은 피하세요</p>
      </div>
      <div class="score-row">
        <div class="score-chip">점수 <b id="catchScore">0</b></div>
        <div class="score-chip">시간 <b id="catchTime">30</b></div>
        <div class="score-chip">최고 <b id="catchBest">0</b></div>
      </div>
      <div class="hole-grid" id="holeGrid"></div>
      <div class="game-btn-row">
        <button class="pill-btn primary" id="catchStart">게임 시작 ▶</button>
      </div>
    </section>

    <!-- ========== 카드 게임 ========== -->
    <section id="view-memory" class="view" aria-label="짝맞추기 게임">
      <div class="game-head">
        <h2>🃏 하치와레 카드 짝맞추기</h2>
        <p class="game-desc">같은 그림 카드를 찾아 뒤집어요</p>
      </div>
      <div class="score-row">
        <div class="score-chip">뒤집기 <b id="memMoves">0</b></div>
        <div class="score-chip">시간 <b id="memTime">0</b>초</div>
        <div class="score-chip">최고 <b id="memBest">-</b></div>
      </div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="game-btn-row">
        <button class="pill-btn primary" id="memReset">새 게임 🔄</button>
      </div>
    </section>
  </main>

  <!-- ========== 하단 반응형 네비게이션 ========== -->
  <nav class="tabbar" aria-label="메뉴">
    <button class="tab is-active" data-view="play"><span class="tab-ico">🐱</span><span class="tab-txt">놀아주기</span></button>
    <button class="tab" data-view="catch"><span class="tab-ico">🕳️</span><span class="tab-txt">잡기</span></button>
    <button class="tab" data-view="memory"><span class="tab-ico">🃏</span><span class="tab-txt">카드</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
